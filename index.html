<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RATM</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <link href="css/bootstrap-4.4.1.css" rel="stylesheet" type="text/css">
    <style type="text/css">
      .image-container {
        position: relative;
        width: 100%;
        overflow: hidden;
      }

      .background-image {
        width: 100%;
        height: auto;
        display: block;
      }

      .overlay-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 9999;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }

      /* Hotspot dot overlays */
      .hotspot {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        cursor: pointer;
        background: rgba(255, 200, 50, 0.35);
        border: 3px solid rgba(255, 200, 50, 0.9);
        box-shadow: 0 0 12px 4px rgba(255, 200, 50, 0.5);
        animation: pulse 1.8s ease-in-out infinite;
        text-decoration: none;
        display: block;
        z-index: 10;
        aspect-ratio: 1 / 1;
      }

      .hotspot:hover {
        background: rgba(255, 200, 50, 0.6);
      }

      @keyframes pulse {
        0%   { opacity: 1;   transform: translate(-50%, -50%) scale(1); }
        50%  { opacity: 0.3; transform: translate(-50%, -50%) scale(0.85); }
        100% { opacity: 1;   transform: translate(-50%, -50%) scale(1); }
      }

      /* Intro message — right side, vertically centred */
      .intro-message {
        position: absolute;
        top: 50%;
        right: 1.5%;
        transform: translateY(-50%);
        z-index: 20;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: clamp(0.75rem, 1.2vw, 1.1rem);
        color: rgba(33, 37, 41, 0.85);
        width: 20%;
        line-height: 1.8;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .intro-message .lang-block {
        display: block;
      }

      .intro-message .word {
        display: inline;
        opacity: 0;
        animation: wordFadeIn 0.4s ease forwards;
      }

      @keyframes wordFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>

    <a href="#"><img src="Images/overlay_image.jpg" alt="Overlay Image" class="overlay-image" id="overlayImage" onclick="hideOverlay();"></a>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="index.html">Home&nbsp;</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent1" aria-controls="navbarSupportedContent1" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent1"></div>
    </nav>

    <div class="container-fluid p-0">
      <div class="image-container">
        <img src="Images/background_image.png" alt="Background Image" class="background-image" width="3840" height="2160" id="background">
        <!-- Hotspot overlays: coords from image-map.net, converted to % of 3840x2160 -->
        <a class="hotspot" href="Room1.html"  title="Room 1"  style="left:20.743%;top:65.787%;width:7.719%;"></a>
        <a class="hotspot" href="Room2.html"  title="Room 2"  style="left:29.053%;top:30.626%;width:6.312%;"></a>
        <a class="hotspot" href="Room3.html"  title="Room 3"  style="left:66.927%;top:33.611%;width:5.156%;"></a>
        <a class="hotspot" href="Room4.html"  title="Room 4"  style="left:66.868%;top:48.250%;width:5.396%;"></a>
        <a class="hotspot" href="Room5.html"  title="Room 5"  style="left:47.578%;top:49.306%;width:4.740%;"></a>
        <a class="hotspot" href="Room6.html"  title="Room 6"  style="left:41.927%;top:21.470%;width:4.210%;"></a>
        <a class="hotspot" href="Room7.html"  title="Room 7"  style="left:47.734%;top:21.667%;width:4.210%;"></a>
        <a class="hotspot" href="Room8.html"  title="Room 8"  style="left:61.276%;top:70.324%;width:8.500%;"></a>
        <a class="hotspot" href="Room9.html"  title="Room 9"  style="left:41.302%;top:68.935%;width:4.402%;"></a>
        <a class="hotspot" href="Room10.html" title="Room 10" style="left:3.672%;top:48.194%;width:5.104%;"></a>
        <div class="intro-message" id="introMessage"></div>
      </div>
    </div>

    <script>
      function startIntroMessage() {
        var english = "Tap on one of the rooms to enter this guthu house and explore the stories behind everyday objects.";
        var kannada = "ಈ ಗುತ್ತು ಮನೆಗೆ ಪ್ರವೇಶಿಸಲು ಮತ್ತು ದಿನನಿತ್ಯದ ವಸ್ತುಗಳ ಹಿಂದಿನ ಕಥೆಗಳನ್ನು ಅನ್ವೇಷಿಸಲು ಕೊಠಡಿಗಳಲ್ಲಿ ಒಂದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ.";
        var container = document.getElementById("introMessage");
        var delay = 0.3;
        var index = 0;

        // English block
        var enBlock = document.createElement("span");
        enBlock.className = "lang-block";
        english.split(" ").forEach(function(word) {
          var span = document.createElement("span");
          span.className = "word";
          span.textContent = word + " ";
          span.style.animationDelay = (index * delay) + "s";
          enBlock.appendChild(span);
          index++;
        });
        container.appendChild(enBlock);

        // Kannada block — continues delay after English finishes
        var knBlock = document.createElement("span");
        knBlock.className = "lang-block";
        kannada.split(" ").forEach(function(word) {
          var span = document.createElement("span");
          span.className = "word";
          span.textContent = word + " ";
          span.style.animationDelay = (index * delay) + "s";
          knBlock.appendChild(span);
          index++;
        });
        container.appendChild(knBlock);
      }

      function playDoorSound() {
        new Audio('Audio/dooropen.mp3').play();
      }

      function hideOverlay() {
        playDoorSound();
        var overlay = document.getElementById("overlayImage");
        overlay.style.opacity = "0";
        setTimeout(function() {
          overlay.style.display = "none";
          startIntroMessage();
        }, 200);
      }
    </script>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap-4.4.1.js"></script>

  </body>
</html>
